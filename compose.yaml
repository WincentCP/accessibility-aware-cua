services:
  postgres:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_DB: cua
      POSTGRES_USER: cua
      POSTGRES_PASSWORD: cua_local_only
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cua -d cua"]
      interval: 3s
      timeout: 3s
      retries: 15
    volumes:
      - cua_postgres_data:/var/lib/postgresql/data

volumes:
  cua_postgres_data:
