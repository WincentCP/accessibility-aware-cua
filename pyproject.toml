[project]
name = "accessibility-aware-cua"
version = "0.6.0"
description = "Accessibility-aware CUA research monorepo, deterministic benchmark, and hidden oracle"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "jinja2==3.1.6",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "playwright==1.52.0",
  "psycopg[binary]==3.2.9",
  "python-dotenv==1.1.0",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pre-commit==4.2.0",
  "pytest==8.3.5",
  "ruff==0.11.10",
]

[project.scripts]
cua-api = "apps.api.a11y_api.app:run"

[build-system]
requires = ["setuptools==80.7.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["a11y_benchmark*", "apps*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.unittest]
start-directory = "tests"
